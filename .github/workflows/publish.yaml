name: "Build Proxmox cloud images and create GitHub Release draft for new versions"

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the image filenames (e.g. v1.0.0-test)"
        required: false
        default: "dev"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        init: [systemd, openrc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdisk dosfstools qemu-utils qemu-system-x86 ovmf xorriso
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Pins only move through sources.json, so the stage3 and repository
      # snapshot can be reused until the next update
      - name: Cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/downloads
          key: gentoo-downloads-${{ matrix.init }}-${{ hashFiles('sources.json') }}
      # Binary packages and source tarballs carry over between pins, so restore
      # the newest cache and save a new one only when the package index changes
      - name: Restore package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache/binpkgs/${{ matrix.init }}
            cache/distfiles
          # Never matches exactly, so this always restores the newest cache
          key: gentoo-packages-${{ matrix.init }}-${{ github.run_id }}
          restore-keys: gentoo-packages-${{ matrix.init }}-
      - name: Determine version label
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build QCOW2 image
        run: |
          # Compress release images, but keep manual runs fast
          if [ "${{ github.event_name }}" = "push" ]; then
            sudo ./scripts/build.sh ${{ matrix.init }} --compress
          else
            sudo ./scripts/build.sh ${{ matrix.init }}
          fi
      - name: Save package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache/binpkgs/${{ matrix.init }}
            cache/distfiles
          key: gentoo-packages-${{ matrix.init }}-${{ hashFiles(format('cache/binpkgs/{0}/Packages', matrix.init)) }}
      - name: Boot and test image
        run: SMOKE_LOG=serial-${{ matrix.init }}.log ./scripts/smoke-test.sh out/*.qcow2
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serial-log-${{ matrix.init }}
          path: serial-${{ matrix.init }}.log
          if-no-files-found: ignore
      - name: Copy QCOW2 image
        run: |
          cp out/*.qcow2 gentoo-${{ matrix.init }}-pxmx-${{ steps.version.outputs.version }}-x86_64.qcow2
      - name: Check image size
        run: |
          ls -lh gentoo-${{ matrix.init }}-pxmx-${{ steps.version.outputs.version }}-x86_64.qcow2
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qcow2-artifact-${{ matrix.init }}-x86_64
          path: gentoo-${{ matrix.init }}-pxmx-${{ steps.version.outputs.version }}-x86_64.qcow2
  create-release:
    needs: build
    runs-on: ubuntu-latest
    # Only create a release on tag pushes, not manual runs
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: qcow2-artifacts
          pattern: qcow2-artifact-*
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: qcow2-artifacts/*.qcow2
